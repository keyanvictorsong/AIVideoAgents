[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-publisher-agent"
version = "0.1.0"
description = "本地视频封面与抖音创作者中心发布助手"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "playwright>=1.50,<2",
]

[project.scripts]
douyin-agent = "douyin_agent.cli:main"

[tool.setuptools.packages.find]
include = ["douyin_agent*"]
