[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talking-editor"
version = "0.1.0"
description = "Local, reusable talking-head video trimming and caption pipeline"
requires-python = ">=3.11,<3.14"
dependencies = ["faster-whisper==1.2.1", "jieba==0.42.1"]

[project.optional-dependencies]
mac = ["mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8,<10"]

[project.scripts]
talking-editor = "talking_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

