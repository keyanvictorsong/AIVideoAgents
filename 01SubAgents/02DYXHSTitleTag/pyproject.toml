[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyxhs-title-tag"
version = "0.1.0"
description = "Evidence-based local video copywriting for Douyin and Xiaohongshu"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[project.scripts]
dyxhs = "dyxhs_title_tag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dyxhs_title_tag = ["*.swift", "helpers/*.swift", "*.js"]
